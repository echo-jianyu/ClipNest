name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ClipNest.slnx

      - name: Build
        run: dotnet build ClipNest.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ClipNest.slnx -c Release --no-build

      - name: Publish
        run: >
          dotnet publish ClipNest/ClipNest.csproj
          -c Release
          -p:PublishProfile=FrameworkDependent-Windows
          -p:DebugType=None
          -o artifacts/windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipNest-windows-framework-4.8
          path: artifacts/windows

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ClipNest.slnx

      - name: Build
        run: dotnet build ClipNest.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ClipNest.slnx -c Release --no-build

      - name: Publish
        run: >
          dotnet publish ClipNest/ClipNest.csproj
          -c Release
          -p:PublishProfile=FrameworkDependent-Windows
          -p:DebugType=None
          -o artifacts/windows

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $version = $tag.TrimStart("v")
          $asset = "artifacts/windows/ClipNest-$version.exe"
          $expectedAsset = Split-Path $asset -Leaf
          if (-not (Test-Path $asset)) {
            throw "Release executable not found: $asset"
          }

          $existing = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            foreach ($item in $release.assets) {
              if ($item.name -ne $expectedAsset) {
                gh release delete-asset $tag $item.name --yes
              }
            }

            gh release upload $tag $asset --clobber
          }
          else {
            gh release create $tag $asset `
              --title "ClipNest $version" `
              --generate-notes
          }
